name: Update head-to-head record

on:
  schedule:
    # Weekly sync: every weekly data job retries hourly from Tuesday morning through Wednesday morning (UTC), because GitHub's scheduler
    # runs cron jobs hours late or skips them. Extra runs are harmless: they only commit when something changed.
    # (Monday Night Football is over by about 05:00 UTC Tuesday, so 08:00 UTC on is safely after the week.)
    - cron: "17 8-23 * * 2"
    - cron: "17 0-12 * * 3"
  workflow_dispatch: {}   # lets you click "Run workflow" manually any time
  push:
    branches: [ main ]
    paths:
      - "build_matrix.py"
      - "build_rumbles.py"
      - "history_baseline.tsv"
      - "playoff_baseline.tsv"

permissions:
  contents: write

concurrency:
  group: update-h2h
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build head-to-head matrix
        run: python3 build_matrix.py

      - name: Build Rumbles standings history
        run: python3 build_rumbles.py

      - name: Commit updated files if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -f rumbles_history.json ]; then git add rumbles_history.json; fi
          git diff --cached --quiet && echo "No changes." || git commit -m "Auto-update head-to-head record and Rumbles standings"
          git push
