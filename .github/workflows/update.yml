name: Update head-to-head record

on:
  schedule:
    # Weekly on Tuesday, aimed to be done well before 5am Eastern. Monday Night
    # Football is over by roughly midnight Eastern, so every one of these
    # times is safely after the week's games have finished.
    #
    # GitHub treats cron as best-effort: it can start a run minutes to hours
    # late (or occasionally skip one) when its runners are busy, and times on
    # the hour/half hour are the busiest. So instead of one run, there are
    # three staggered, off-peak runs. Every run recomputes everything from
    # scratch and only commits if something changed, so extra runs are
    # harmless -- whichever fires first does the work, the rest are no-ops
    # (or pick up any late stat corrections).
    #
    # Cron is always UTC. These are chosen to land at 3:17am / 4:47am / 6:17am
    # Eastern during Daylight Time (EDT, through Nov 1 2026), and 2:17 /
    # 3:47 / 5:17am Eastern after clocks fall back (EST) -- so the first two
    # are before 5am Eastern in both. No change needed when DST flips.
    - cron: "17 7 * * 2"
    - cron: "47 8 * * 2"
    - cron: "17 10 * * 2"
  workflow_dispatch: {}   # lets you click "Run workflow" manually any time
  push:
    branches: [ main ]
    paths:
      - "build_matrix.py"
      - "build_rumbles.py"
      - "history_baseline.tsv"
      - "playoff_baseline.tsv"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build head-to-head matrix
        run: python3 build_matrix.py

      - name: Build Rumbles standings history
        run: python3 build_rumbles.py

      - name: Commit updated files if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -f rumbles_history.json ]; then git add rumbles_history.json; fi
          git diff --cached --quiet && echo "No changes." || git commit -m "Auto-update head-to-head record and Rumbles standings"
          git push
