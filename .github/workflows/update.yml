name: Update head-to-head record

on:
  schedule:
    # Weekly, Tuesday 5:30am Eastern (9:30 UTC), well after Monday Night
    # Football and Sleeper's stats have settled -- the whole week's games
    # are done by then. GitHub may delay this by a few minutes under load,
    # which doesn't matter for a once-a-week job.
    #
    # Cron is always UTC, and 9:30 UTC is only 5:30am Eastern during
    # Daylight Time (EDT, roughly mid-March through early November). Once
    # clocks fall back to Standard Time (EST) in November -- which happens
    # mid-season -- this same line runs at 4:30am Eastern instead. If you
    # want it to stay exactly 5:30am after that, change "30 9" to "30 10"
    # once DST ends for the rest of the season.
    - cron: "30 9 * * 2"
  workflow_dispatch: {}   # lets you click "Run workflow" manually any time
  push:
    branches: [ main ]
    paths:
      - "build_matrix.py"
      - "build_rumbles.py"
      - "history_baseline.tsv"
      - "playoff_baseline.tsv"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build head-to-head matrix
        run: python3 build_matrix.py

      - name: Build Rumbles standings history
        run: python3 build_rumbles.py

      - name: Commit updated files if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -f rumbles_history.json ]; then git add rumbles_history.json; fi
          git diff --cached --quiet && echo "No changes." || git commit -m "Auto-update head-to-head record and Rumbles standings"
          git push
